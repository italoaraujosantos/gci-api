services:

  mysql:
    image: italoaraujosantos/gestor-carteira-mysql:1.0
    container_name: gestor-carteira-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestor_carteira
      SPRING_DATASOURCE_USERNAME: carteira
      SPRING_DATASOURCE_PASSWORD: carteira
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "carteira", "-pcarteira"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - gestor-carteira-network

volumes:
  mysql_data:

networks:
  gestor-carteira-network:
    driver: bridge
